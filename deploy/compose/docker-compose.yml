services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tempo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tempo
      LISTEN_ADDR: 0.0.0.0:8080
      AGENT_SETUP_KEY: ${AGENT_SETUP_KEY:?AGENT_SETUP_KEY is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      WEB_PASSWORD: ${WEB_PASSWORD:?WEB_PASSWORD is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AGENT_SETUP_KEY: ${AGENT_SETUP_KEY:?AGENT_SETUP_KEY is required}
      TZ: ${TZ:-Europe/Madrid}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo -d tempo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
