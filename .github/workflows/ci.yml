name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: test -z "$(gofmt -l apps internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./apps/agent ./apps/cli ./apps/server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: git diff --exit-code apps/web/lib/api/generated.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
